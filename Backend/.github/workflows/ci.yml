name: Supplier Service CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medtrack_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dependency Resolution & Compilation
        run: mvn clean compile --no-transfer-progress

      - name: Code Quality & CI Quality Gate
        run: |
          mvn verify --no-transfer-progress
          echo "Test phase complete. JaCoCo coverage checked against >= 80% limit."

      - name: Upload Jacoco Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco

      # SonarQube would be run here if configured via sonar.host.url.
      # E.g. mvn sonar:sonar -Dsonar.projectKey=medtrack-backend -Dsonar.host.url=https://sonarcloud.io
